# Render Blueprint: сайт + CRM + база Postgres + постійний диск для файлів.
# Секрети (Telegram, пароль адміна) задаються в панелі Render, у репозиторій не потрапляють.
services:
  - type: web
    name: kastomni-mebli
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Креслення й фото з CRM. Диск переживає редеплої (файлова система контейнера — ні).
    disk:
      name: files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kastomni-mebli-db
          property: connectionString
      - key: Files__Root
        value: /var/data/files
      - key: Proxy__TrustForwardedHeaders
        value: "true"
      - key: Site__BaseUrl
        value: https://kastomni-mebli.onrender.com
      # Перший вхід у CRM: створюється адміністратор, якщо користувачів ще немає.
      - key: ADMIN_LOGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Контакти на сайті (можна змінити тут або в панелі Render без перезбірки коду)
      - key: Site__Phone
        sync: false
      - key: Site__Telegram
        sync: false

databases:
  - name: kastomni-mebli-db
    region: frankfurt
    plan: basic-256mb
    databaseName: kastomni_mebli
    user: kastomni
